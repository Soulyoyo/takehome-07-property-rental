<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea" />
    </marker>
  </defs>

  <!-- Canvas Background Card -->
  <rect x="15" y="15" width="1170" height="650" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />

  <!-- HEADER -->
  <g transform="translate(40, 48)">
    <rect x="0" y="-4" width="6" height="32" rx="3" fill="#2563eb" />
    <text x="18" y="20" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="-0.5px">Property Rental &amp; Maintenance System — Data Flow Diagram (DFD)</text>
    <text x="18" y="42" font-size="13" font-weight="400" fill="#64748b">A clear, plain-English view of how people, daily tasks, and records connect together</text>
  </g>

  <!-- LEGEND -->
  <g transform="translate(850, 42)">
    <rect x="0" y="0" width="300" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <!-- Actor indicator -->
    <rect x="12" y="14" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <text x="32" y="25" font-size="11" font-weight="600" fill="#334155">People (Actors)</text>
    <!-- Process indicator -->
    <circle cx="138" cy="21" r="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="150" y="25" font-size="11" font-weight="600" fill="#334155">Activities</text>
    <!-- Data store indicator -->
    <rect x="216" y="14" width="14" height="14" rx="2" fill="#ffffff" stroke="#475569" stroke-width="2" stroke-dasharray="3,2" />
    <text x="236" y="25" font-size="11" font-weight="600" fill="#334155">Records</text>
  </g>

  <!-- CONNECTIONS / ARROWS -->
  <!-- 1. Property Manager to Apartments & Tenants -->
  <path d="M 270 160 L 360 160" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="274" y="142" width="76" height="16" rx="4" fill="#eff6ff" />
  <text x="312" y="154" font-size="9.5" font-weight="600" fill="#1e40af" text-anchor="middle">Add / Edit Units</text>

  <!-- 2. Apartments & Tenants to Apartments & Tenants List -->
  <path d="M 480 205 L 480 475" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="420" y="325" width="120" height="20" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
  <text x="480" y="339" font-size="10" font-weight="600" fill="#15803d" text-anchor="middle">Save Unit &amp; Tenant Info</text>

  <!-- 3. Property Manager to Rent & Alerts -->
  <path d="M 160 210 L 160 278" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="95" y="234" width="130" height="18" rx="4" fill="#eff6ff" />
  <text x="160" y="247" font-size="10" font-weight="600" fill="#1e40af" text-anchor="middle">Record Rent Payments</text>

  <!-- 4. Rent & Alerts to Property Manager (Overdue alert return) -->
  <path d="M 80 285 L 80 210" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <rect x="25" y="235" width="105" height="18" rx="4" fill="#fffbeb" />
  <text x="77" y="248" font-size="9.5" font-weight="600" fill="#b45309" text-anchor="middle">Overdue Rent Alerts</text>

  <!-- 5. Rent & Alerts to Rent Payment Records -->
  <path d="M 160 385 L 160 475" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="95" y="420" width="130" height="18" rx="4" fill="#f8fafc" />
  <text x="160" y="433" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Save Paid Transactions</text>

  <!-- 6. Apartments List to Rent & Alerts (Lookup rent price) -->
  <path d="M 370 515 L 280 370" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)" />
  <rect x="270" y="435" width="100" height="18" rx="4" fill="#f8fafc" />
  <text x="320" y="448" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">Lookup Rent Due</text>

  <!-- 7. Property Manager to Repairs & Work Orders -->
  <path d="M 270 190 Q 420 255 580 280" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="365" y="238" width="135" height="18" rx="4" fill="#eff6ff" />
  <text x="432" y="251" font-size="10" font-weight="600" fill="#1e40af" text-anchor="middle">Log Repair &amp; Pick Plumber</text>

  <!-- 8. Repairs to Contractor (Notify Job) -->
  <path d="M 830 300 Q 940 260 980 210" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="850" y="240" width="125" height="18" rx="4" fill="#fff7ed" />
  <text x="912" y="253" font-size="10" font-weight="600" fill="#c2410c" text-anchor="middle">View Assigned Jobs</text>

  <!-- 9. Contractor to Repairs (Mark fixed & notes) -->
  <path d="M 1040 210 Q 1010 320 830 340" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)" />
  <rect x="900" y="325" width="135" height="18" rx="4" fill="#faf5ff" />
  <text x="967" y="338" font-size="10" font-weight="600" fill="#7e22ce" text-anchor="middle">Submit Notes &amp; Mark Fixed</text>

  <!-- 10. Repairs to Repair Log Store -->
  <path d="M 705 385 L 705 475" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="635" y="420" width="140" height="18" rx="4" fill="#f8fafc" />
  <text x="705" y="433" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Save Status, Dates &amp; Notes</text>

  <!-- 11. Stores to Executive Overview (Feed KPI metrics) -->
  <!-- From Rent Store to Overview -->
  <path d="M 280 540 Q 600 640 1020 405" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <rect x="520" y="605" width="130" height="18" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
  <text x="585" y="618" font-size="9.5" font-weight="600" fill="#0369a1" text-anchor="middle">Total Monthly Rent $</text>

  <!-- From Repairs Store to Overview -->
  <path d="M 870 540 Q 950 500 985 405" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <rect x="915" y="465" width="125" height="18" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
  <text x="977" y="478" font-size="9.5" font-weight="600" fill="#0369a1" text-anchor="middle">Completed Repairs Count</text>

  <!-- 12. Executive Overview back to Property Manager (Dashboard) -->
  <path d="M 920 340 Q 600 390 270 200" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="525" y="365" width="150" height="20" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
  <text x="600" y="379" font-size="10" font-weight="600" fill="#0284c7" text-anchor="middle">Revenue Cards &amp; Trend Charts</text>


  <!-- ==================== ENTITIES / NODES ==================== -->

  <!-- ACTOR 1: PROPERTY MANAGER -->
  <g transform="translate(45, 115)" filter="url(#card-shadow)">
    <rect width="225" height="92" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
    <rect x="0" y="0" width="225" height="28" rx="12" fill="#2563eb" />
    <rect x="0" y="16" width="225" height="12" fill="#2563eb" />
    <text x="112" y="19" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">👤 PROPERTY MANAGER</text>
    <text x="112" y="48" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">Primary System Administrator</text>
    <text x="112" y="65" font-size="10.5" fill="#3b82f6" text-anchor="middle">• Creates units &amp; collects rent</text>
    <text x="112" y="79" font-size="10.5" fill="#3b82f6" text-anchor="middle">• Hires contractors &amp; views reports</text>
  </g>

  <!-- ACTOR 2: MAINTENANCE CONTRACTOR -->
  <g transform="translate(930, 115)" filter="url(#card-shadow)">
    <rect width="225" height="92" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2.5" />
    <rect x="0" y="0" width="225" height="28" rx="12" fill="#9333ea" />
    <rect x="0" y="16" width="225" height="12" fill="#9333ea" />
    <text x="112" y="19" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">🔧 CONTRACTOR / WORKER</text>
    <text x="112" y="48" font-size="11.5" font-weight="600" fill="#581c87" text-anchor="middle">Plumber / Electrician / Repair</text>
    <text x="112" y="65" font-size="10.5" fill="#8b5cf6" text-anchor="middle">• Only sees assigned work orders</text>
    <text x="112" y="79" font-size="10.5" fill="#8b5cf6" text-anchor="middle">• Adds work notes &amp; marks fixed</text>
  </g>

  <!-- PROCESS 1: APARTMENTS & TENANTS -->
  <g transform="translate(365, 115)" filter="url(#card-shadow)">
    <rect width="230" height="88" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <rect x="12" y="10" width="26" height="26" rx="13" fill="#16a34a" />
    <text x="25" y="27" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="46" y="27" font-size="13" font-weight="700" fill="#14532d">Apartments &amp; Tenants</text>
    <text x="115" y="52" font-size="10.5" fill="#166534" text-anchor="middle">Manage buildings, apartment numbers,</text>
    <text x="115" y="68" font-size="10.5" fill="#166534" text-anchor="middle">monthly rent, and active tenant contacts</text>
  </g>

  <!-- PROCESS 2: RENT & OVERDUE ALERTS -->
  <g transform="translate(45, 285)" filter="url(#card-shadow)">
    <rect width="230" height="98" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
    <rect x="12" y="10" width="26" height="26" rx="13" fill="#d97706" />
    <text x="25" y="27" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="46" y="27" font-size="13" font-weight="700" fill="#78350f">Rent &amp; Overdue Alerts</text>
    <text x="115" y="52" font-size="10.5" fill="#92400e" text-anchor="middle">Log incoming rent checks &amp; dates.</text>
    <text x="115" y="68" font-size="10.5" fill="#92400e" text-anchor="middle">Checks grace period, flags late units,</text>
    <text x="115" y="84" font-size="10.5" fill="#92400e" text-anchor="middle">and generates exportable rent rolls</text>
  </g>

  <!-- PROCESS 3: REPAIRS & WORK ORDERS -->
  <g transform="translate(580, 275)" filter="url(#card-shadow)">
    <rect width="250" height="108" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
    <rect x="12" y="10" width="26" height="26" rx="13" fill="#ea580c" />
    <text x="25" y="27" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="46" y="27" font-size="13" font-weight="700" fill="#7c2d12">Repairs &amp; Work Orders</text>
    <text x="125" y="50" font-size="10.5" fill="#9a3412" text-anchor="middle">Step 1: Tenant reports broken item</text>
    <text x="125" y="66" font-size="10.5" fill="#9a3412" text-anchor="middle">Step 2: Assign contractor &amp; schedule date</text>
    <text x="125" y="82" font-size="10.5" fill="#9a3412" text-anchor="middle">Step 3: Contractor submits notes &amp; fixes</text>
  </g>

  <!-- PROCESS 4: EXECUTIVE OVERVIEW -->
  <g transform="translate(925, 290)" filter="url(#card-shadow)">
    <rect width="235" height="102" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <rect x="12" y="10" width="26" height="26" rx="13" fill="#0284c7" />
    <text x="25" y="27" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="46" y="27" font-size="13" font-weight="700" fill="#0369a1">Executive Overview</text>
    <text x="117" y="52" font-size="10.5" fill="#075985" text-anchor="middle">Aggregates real-time business health:</text>
    <text x="117" y="68" font-size="10.5" fill="#075985" text-anchor="middle">• Total rent collected this month</text>
    <text x="117" y="84" font-size="10.5" fill="#075985" text-anchor="middle">• 8-week weekly repair trend charts</text>
  </g>

  <!-- ==================== DATA STORES (FILING CABINETS) ==================== -->

  <!-- STORE 1: RENT PAYMENT RECORDS -->
  <g transform="translate(45, 480)" filter="url(#card-shadow)">
    <rect width="230" height="78" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="24" x2="230" y2="24" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#d97706" />
    <text x="20" y="17" font-size="12" font-weight="700" fill="#0f172a">💰 Rent Payment Records</text>
    <text x="20" y="42" font-size="10" fill="#475569">Saved: Payment date, dollar amount,</text>
    <text x="20" y="56" font-size="10" fill="#475569">unit ID, month covered, payment mode</text>
    <text x="20" y="70" font-size="9" font-weight="600" fill="#94a3b8">PERMANENT FINANCIAL LEDGER</text>
  </g>

  <!-- STORE 2: APARTMENTS & TENANTS LIST -->
  <g transform="translate(365, 480)" filter="url(#card-shadow)">
    <rect width="230" height="78" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="24" x2="230" y2="24" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#16a34a" />
    <text x="20" y="17" font-size="12" font-weight="700" fill="#0f172a">📁 Apartments &amp; Tenants List</text>
    <text x="20" y="42" font-size="10" fill="#475569">Saved: Unit numbers, physical address,</text>
    <text x="20" y="56" font-size="10" fill="#475569">monthly rent amount, grace period days</text>
    <text x="20" y="70" font-size="9" font-weight="600" fill="#94a3b8">PORTFOLIO REGISTRY</text>
  </g>

  <!-- STORE 3: REPAIR TICKETS & AUDIT LOG -->
  <g transform="translate(590, 480)" filter="url(#card-shadow)">
    <rect width="230" height="78" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="24" x2="230" y2="24" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#ea580c" />
    <text x="20" y="17" font-size="12" font-weight="700" fill="#0f172a">📋 Repair Tickets &amp; Audit Log</text>
    <text x="20" y="42" font-size="10" fill="#475569">Saved: Issue description, assigned pro,</text>
    <text x="20" y="56" font-size="10" fill="#475569">status timeline, resolution notes &amp; dates</text>
    <text x="20" y="70" font-size="9" font-weight="600" fill="#94a3b8">COMPLIANCE &amp; REPAIR TRACKING</text>
  </g>

</svg>